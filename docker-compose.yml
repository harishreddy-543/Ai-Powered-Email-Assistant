version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: email_assistant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: email_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: email_assistant_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: email_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/email_assistant
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=docker_container_supersecretkeyforlocalemailassistantjwt
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: email_assistant_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
